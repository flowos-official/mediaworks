name: Publish Skill Registry

on:
  push:
    branches: [main]
    paths:
      - "lib/registry/skills/**"
      - "lib/registry/pipelines/**"
      - "scripts/publish-registry.ts"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches Vercel deployment's default (Node 22 LTS or newer);
          # transitive deps like mixpart require >=22.
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Publish registry to Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: npx tsx scripts/publish-registry.ts
